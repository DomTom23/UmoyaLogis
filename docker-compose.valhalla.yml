# Własny serwer tras dla ciężarówek (Valhalla). Uruchomienie razem z aplikacją:
#   docker compose -f docker-compose.yml -f docker-compose.valhalla.yml up -d
# Pierwsze uruchomienie pobiera mapy i buduje kafle (godziny, dziesiątki GB dysku) - patrz DEPLOY.md, sekcja 8.
# Plik NIE był testowany na prawdziwym Dockerze: sprawdź nazwy zmiennych w README obrazu gis-ops/docker-valhalla.
services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: valhalla
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"        # tylko z tego komputera; aplikacja łączy się przez sieć Dockera
    volumes:
      - ./valhalla_data:/custom_files
    environment:
      # kraje, po których jeździmy (Geofabrik). Dodawaj/usuwaj wpisy; mniej krajów = szybciej i mniej RAM-u
      tile_urls: >-
        https://download.geofabrik.de/europe/poland-latest.osm.pbf
        https://download.geofabrik.de/europe/germany-latest.osm.pbf
        https://download.geofabrik.de/europe/france-latest.osm.pbf
        https://download.geofabrik.de/europe/belgium-latest.osm.pbf
        https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
        https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
        https://download.geofabrik.de/europe/italy-latest.osm.pbf
        https://download.geofabrik.de/europe/austria-latest.osm.pbf
        https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
        https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
        https://download.geofabrik.de/europe/spain-latest.osm.pbf
        https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      serve_tiles: "True"
      server_threads: "4"
      # bez limitu 1500 km na zapytanie (publiczny serwer ma 1500 km)
      service_limits_truck_max_distance: "5000000"
      service_limits_max_exclude_polygons_length: "100000"
  app:
    environment:
      VALHALLA_URL: http://valhalla:8002
    depends_on:
      - valhalla
